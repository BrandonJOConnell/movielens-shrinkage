[project]
name = "movielens-shrinkage"
version = "0.1.0"
description = "Empirical-Bayes shrinkage of film ratings on MovieLens 32M, with DuckDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "numpyro>=0.22.0",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]
